name: 构建桌面版并发布 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 v2.3.3；留空则使用 v0.0.0-run.<运行号>"
        required: false
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.23.x"

jobs:
  # 版本号先算出来：Windows 与 macOS 各自编译时用它注入 -X main.version，
  # 这样二进制里 `-manifest-info` 显示的版本与 Release 标签永远一致。
  version:
    name: 确定版本号
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - name: 计算标签
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GIT_TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then tag="$INPUT_VERSION"
          elif [[ "$GIT_TAG" == v* ]]; then tag="$GIT_TAG"
          else tag="v0.0.0-run.$RUN_NUMBER"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "版本：$tag（注入 main.version=${tag#v}）"

  test:
    name: 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/importer-v2
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: work/importer-v2/go.sum

      - name: 运行 Go 测试
        run: go test ./...

      # 桌面入口的测试不在这里跑：-tags desktop 在 Linux 上要 gtk+-3.0 与
      # webkit2gtk 的头文件，ubuntu runner 没有装。桌面版只发 Windows 与 macOS，
      # 那两个平台各自的 job 里已经跑过同一批测试。

      - name: 运行桥接测试
        run: |
          if command -v node >/dev/null 2>&1; then
            node --test bridge_test.mjs
          else
            echo "跳过：runner 无 node"
          fi

  windows:
    name: Windows ${{ matrix.arch }}
    needs: [version, test]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            goarch: amd64
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: work/importer-v2/go.sum

      # 桌面入口（-tags desktop）与核心同包，产物就是一个 exe，
      # 不再需要另外复制一份 core 到 Resources 里。
      - name: 编译单文件
        shell: pwsh
        run: |
          python scripts/build_desktop.py --platform windows/${{ matrix.goarch }} `
            --version ${{ needs.version.outputs.ver }} --out dist
          Get-ChildItem dist

      - name: 确认产物只有一个文件
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File)
          if ($files.Count -ne 1) { throw "应只有 1 个文件，实际 $($files.Count)" }
          Write-Host "OK：$($files[0].Name)"

      - name: 打包
        shell: pwsh
        run: |
          $zip = "SteamCollectionImporter-windows-${{ matrix.arch }}.zip"
          New-Item -ItemType Directory -Force dist/pkg | Out-Null
          Copy-Item "dist/SteamCollectionImporter.exe" "dist/pkg/"
          Copy-Item "LICENSE" "dist/pkg/LICENSE"
          Compress-Archive -Path "dist/pkg/*" -DestinationPath $zip -Force
          Get-FileHash -Algorithm SHA256 $zip |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $zip" } |
            Out-File "$($zip -replace '\.zip$','.SHA256SUMS.txt')" -Encoding utf8
          Get-ChildItem *.zip, *.txt | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            SteamCollectionImporter-windows-${{ matrix.arch }}.zip
            SteamCollectionImporter-windows-${{ matrix.arch }}.SHA256SUMS.txt

  macos:
    name: macOS ${{ matrix.arch }}
    needs: [version, test]
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            goarch: arm64
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: work/importer-v2/go.sum

      # .app 里的 Contents/MacOS/ 下只有一个可执行文件，
      # 没有旧版那种 Resources/SteamCollectionImporterCore 子进程。
      # 脚本里会做 ad-hoc 签名，否则 Apple Silicon 直接拒绝启动。
      - name: 编译 .app 与 DMG
        run: |
          python3 scripts/build_desktop.py --platform darwin/${{ matrix.goarch }} \
            --version ${{ needs.version.outputs.ver }} --out dist --dmg
          ls -R dist | head -20

      - name: 校验 .app 结构
        run: |
          set -e
          app="dist/SteamCollectionImporter.app"
          test -d "$app"
          exes=$(find "$app" -type f -perm -u+x | wc -l | tr -d ' ')
          echo "可执行文件数：$exes"
          test "$exes" = "1" || { echo "::error::.app 里应只有 1 个可执行文件，实际 $exes"; exit 1; }
          test -f "$app/Contents/Info.plist"
          codesign -dv "$app" 2>&1 | head -3 || true

      - name: 打包
        run: |
          set -e
          base="SteamCollectionImporter-macOS-${{ matrix.arch }}"
          ditto -c -k --sequesterRsrc --keepParent "dist/SteamCollectionImporter.app" "$base.zip"
          mv "dist/SteamCollectionImporter-macOS-${{ matrix.goarch }}.dmg" "$base.dmg"
          shasum -a 256 "$base.zip" "$base.dmg" > "$base.SHA256SUMS.txt"
          ls -lh "$base".*

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            SteamCollectionImporter-macOS-${{ matrix.arch }}.zip
            SteamCollectionImporter-macOS-${{ matrix.arch }}.dmg
            SteamCollectionImporter-macOS-${{ matrix.arch }}.SHA256SUMS.txt

  release:
    name: 创建 GitHub Release
    needs: [version, windows, macos]
    # 手动触发（workflow_dispatch）只用来验证整条链路能不能编译出来，
    # 不建 Release、不打标签；只有推 v* 标签才是真的发版。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: 汇总产物
        run: |
          ls -lh assets
          {
            echo "## 下载"
            echo ""
            echo "| 平台 | 文件 | 形态 |"
            echo "|---|---|---|"
            echo "| Windows x64 | \`SteamCollectionImporter-windows-x64.zip\` | 解压得到一个 exe，双击即用 |"
            echo "| macOS Apple Silicon | \`SteamCollectionImporter-macOS-arm64.dmg\` | 拖进「应用程序」，双击即用 |"
            echo ""
            echo "## 关于「单文件」"
            echo ""
            echo "程序只有一个可执行文件：Windows 是一个 exe；macOS 的 .app 里 \`Contents/MacOS/\` 下也只有一个可执行文件。"
            echo "没有附带的核心子进程、没有 Resources 里的第二个二进制、不监听任何本地端口——"
            echo "核心与窗口跑在同一个进程里，直接从内存拿页面。"
            echo ""
            echo "## 校验"
            echo ""
            echo "每个压缩包都附带同名 \`.SHA256SUMS.txt\`。"
            echo ""
            echo "## 说明"
            echo ""
            echo "工具通过 Steam 自带的 CEF 调试端口读取你的库并写入静态收藏，全程只连 \`127.0.0.1\`。"
            echo "写入前会自动备份到数据目录，可用「恢复备份」回滚。动态收藏（VR、已安装、原声音轨等）只读，不会被改动。"
            echo ""
            echo "macOS 包为 ad-hoc 签名（未公证），首次打开如提示「无法验证开发者」，"
            echo "在「系统设置 → 隐私与安全性」里点「仍要打开」，或执行 \`xattr -dr com.apple.quarantine /Applications/SteamCollectionImporter.app\`。"
            echo ""
            echo "命令行版本也还在：\`go build .\` 得到 CLI，\`go build -tags desktop\` 得到桌面版。"
          } > release-notes.md
          cat release-notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Steam 收藏整理工具 ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          files: assets/*
