name: 构建桌面版并发布 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 v2.3.3；留空则使用 v0.0.0-run.<运行号>"
        required: false
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.23.x"
  WAILS_VERSION: "v2.10.2"

jobs:
  # 版本号先算出来，后面编译核心时注入 -X main.version，
  # 这样二进制里 `tool -manifest-info` 显示的版本与 Release 标签永远一致。
  version:
    name: 确定版本号
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - name: 计算标签
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GIT_TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then tag="$INPUT_VERSION"
          elif [[ "$GIT_TAG" == v* ]]; then tag="$GIT_TAG"
          else tag="v0.0.0-run.$RUN_NUMBER"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "版本：$tag（注入 main.version=${tag#v}）"

  test:
    name: 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/importer-v2
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: work/importer-v2/go.sum

      - name: 运行 Go 测试
        run: go test -mod=vendor ./...

      - name: 运行桥接测试
        run: |
          if command -v node >/dev/null 2>&1; then
            node --test bridge_test.mjs
          else
            echo "跳过：runner 无 node"
          fi

  windows:
    name: Windows ${{ matrix.arch }}
    needs: [version, test]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: work/importer-v2/go.sum

      - name: 安装 Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 核心就是 work/importer-v2 编译出来的，同一份源码、同一个 tag。
      # 以前从外部 URL 下载二进制，既需要配 4 个仓库变量 + 1 个 Secret，
      # 又可能与外壳版本错配；这里直接编译，依赖全消。
      - name: 编译核心
        working-directory: work/importer-v2
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VER: ${{ needs.version.outputs.ver }}
        run: |
          go build -mod=vendor -trimpath `
            -ldflags "-s -w -X main.version=$env:VER" `
            -o "$env:RUNNER_TEMP\SteamCollectionImporterCore.exe" .
          Get-Item "$env:RUNNER_TEMP\SteamCollectionImporterCore.exe" | Select-Object Length

      - name: 构建 Wails Windows ${{ matrix.arch }}
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          CORE: ${{ runner.temp }}\SteamCollectionImporterCore.exe
        run: python scripts/build_wails_release.py --platform "windows/${{ matrix.goarch }}" --core "$env:CORE"

      - name: 打包 Windows ${{ matrix.arch }}
        shell: pwsh
        run: |
          $release = "SteamCollectionImporter-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "$release/Resources" | Out-Null
          Copy-Item "desktop-wails/build/bin/SteamCollectionImporter.exe" "$release/"
          Copy-Item "desktop-wails/build/bin/Resources/SteamCollectionImporterCore.exe" "$release/Resources/"
          Copy-Item "README.md" "$release/README-中文.md"
          Copy-Item "LICENSE" "$release/"
          Compress-Archive -Path "$release/*" -DestinationPath "$release.zip" -Force
          Get-FileHash -Algorithm SHA256 "$release.zip" | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $release.zip" } | Out-File "$release.SHA256SUMS.txt" -Encoding utf8

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            SteamCollectionImporter-windows-${{ matrix.arch }}.zip
            SteamCollectionImporter-windows-${{ matrix.arch }}.SHA256SUMS.txt

  macos:
    name: macOS ${{ matrix.arch }}
    needs: [version, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            goarch: arm64
          - arch: x64
            runner: macos-13
            goarch: amd64
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: work/importer-v2/go.sum

      - name: 安装 Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 编译核心
        working-directory: work/importer-v2
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VER: ${{ needs.version.outputs.ver }}
        run: |
          go build -mod=vendor -trimpath \
            -ldflags "-s -w -X main.version=$VER" \
            -o "$RUNNER_TEMP/SteamCollectionImporterCore" .
          ls -lh "$RUNNER_TEMP/SteamCollectionImporterCore"

      - name: 构建 Wails macOS ${{ matrix.arch }}
        env:
          CORE_PATH: ${{ runner.temp }}/SteamCollectionImporterCore
        run: python3 scripts/build_wails_release.py --platform "darwin/${{ matrix.goarch }}" --core "$CORE_PATH"

      - name: 打包 macOS App、DMG 和校验值
        run: |
          set -e
          app="desktop-wails/build/bin/SteamCollectionImporter.app"
          test -d "$app"
          base="SteamCollectionImporter-macOS-${{ matrix.arch }}"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$base.zip"
          hdiutil create -volname "Steam 收藏整理" -srcfolder "$app" -ov -format UDZO "$base.dmg"
          shasum -a 256 "$base.zip" "$base.dmg" > "$base.SHA256SUMS.txt"
          cat "$base.SHA256SUMS.txt"

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            SteamCollectionImporter-macOS-${{ matrix.arch }}.zip
            SteamCollectionImporter-macOS-${{ matrix.arch }}.dmg
            SteamCollectionImporter-macOS-${{ matrix.arch }}.SHA256SUMS.txt

  release:
    name: 创建 GitHub Release
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: 汇总产物
        run: |
          ls -lh assets
          {
            echo "## 下载"
            echo ""
            echo "| 平台 | 文件 |"
            echo "|---|---|"
            echo "| Windows x64 | \`SteamCollectionImporter-windows-x64.zip\` |"
            echo "| Windows ARM64 | \`SteamCollectionImporter-windows-arm64.zip\` |"
            echo "| macOS Apple Silicon | \`SteamCollectionImporter-macOS-arm64.dmg\` |"
            echo "| macOS Intel | \`SteamCollectionImporter-macOS-x64.dmg\` |"
            echo ""
            echo "## 校验"
            echo ""
            echo "每个压缩包都附带同名 \`.SHA256SUMS.txt\`。Windows 解压后运行 \`SteamCollectionImporter.exe\`，"
            echo "macOS 打开 DMG 把 App 拖进「应用程序」。"
            echo ""
            echo "## 说明"
            echo ""
            echo "工具通过 Steam 自带的 CEF 调试端口读取你的库并写入静态收藏，全程只连 \`127.0.0.1\`。"
            echo "写入前会自动备份到数据目录，可用「恢复备份」回滚。动态收藏（VR、已安装、原声音轨等）只读，不会被改动。"
            echo ""
            echo "macOS 包为 ad-hoc 签名（未公证），首次打开如提示「无法验证开发者」，"
            echo "在「系统设置 → 隐私与安全性」里点「仍要打开」，或执行 \`xattr -dr com.apple.quarantine /Applications/SteamCollectionImporter.app\`。"
          } > release-notes.md
          cat release-notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Steam 收藏整理工具 ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          files: assets/*
