name: 构建并发布 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 v1.0.0；留空则使用 run-运行号"
        required: false
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.23.x"

jobs:
  test:
    name: Go 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/importer-v2
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: work/importer-v2/go.sum
      - name: 运行测试
        run: go test -mod=vendor ./...

  windows:
    name: Windows ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: work/importer-v2/go.sum
      - name: 编译 Windows ${{ matrix.arch }}
        working-directory: work/importer-v2
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -mod=vendor -o ../../SteamCollectionImporter-windows-${{ matrix.arch }}.exe .
      - name: 打包 Windows ${{ matrix.arch }}
        run: |
          mkdir -p release
          cp "SteamCollectionImporter-windows-${{ matrix.arch }}.exe" release/
          cp README.md release/README-中文.md
          cp LICENSE release/
          (cd release && shasum -a 256 * > SHA256SUMS.txt)
          tar -czf "SteamCollectionImporter-windows-${{ matrix.arch }}.tar.gz" -C release .
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: SteamCollectionImporter-windows-${{ matrix.arch }}.tar.gz

  macos:
    name: macOS ARM64
    needs: test
    runs-on: macos-14
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: work/importer-v2/go.sum
      - name: 写入 GUI 核心
        env:
          GUI_CORE_B64: ${{ secrets.GUI_CORE_B64 }}
        run: |
          if [ -z "$GUI_CORE_B64" ]; then
            echo "缺少仓库 Secret GUI_CORE_B64。请将 SteamCollectionImporterCore 以 base64 内容保存到该 Secret。" >&2
            exit 1
          fi
          # macOS runner 使用 BSD base64，-D 是其解码参数。
          printf '%s' "$GUI_CORE_B64" | base64 -D > "$RUNNER_TEMP/SteamCollectionImporterCore"
          chmod 755 "$RUNNER_TEMP/SteamCollectionImporterCore"
      - name: 构建 macOS App 和 DMG
        run: python3 scripts/build_release.py --gui-core "$RUNNER_TEMP/SteamCollectionImporterCore" --output-dir dist
      - name: 打包 macOS 配置文件
        run: |
          cd dist
          app_dir=$(find . -maxdepth 1 -type d -name 'SteamCollectionImporter-macOS-arm64-*' | head -1)
          dmg=$(find . -maxdepth 1 -type f -name '*.dmg' | head -1)
          tar -czf "${app_dir##*/}.tar.gz" "$app_dir"
          shasum -a 256 "$dmg" "${app_dir##*/}.tar.gz" > SHA256SUMS.txt
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/SHA256SUMS.txt

  release:
    name: 发布 GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows x64
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: assets
      - name: 下载 Windows ARM64
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64
          path: assets
      - name: 下载 macOS ARM64
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: assets
      - name: 计算 Release 标签
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GIT_TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then tag="$INPUT_VERSION"; \
          elif [[ "$GIT_TAG" == v* ]]; then tag="$GIT_TAG"; \
          else tag="v0.0.0-run.$RUN_NUMBER"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=Steam 收藏整理工具 $tag" >> "$GITHUB_OUTPUT"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          generate_release_notes: true
          files: assets/*
