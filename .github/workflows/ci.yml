name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.23.x"

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/importer-v2
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: work/importer-v2/go.sum

      # 只测命令行构建。桌面构建（-tags desktop）在 Linux 上需要 gtk/webkit 头文件，
      # ubuntu runner 没有；它的测试放在下面的 desktop job（Windows）里跑。
      - name: go vet
        run: go vet ./...

      - name: go test
        id: gotest
        # 个人清单 classification.json 不进仓库，测试会自动回落到
        # classification.example.json，依赖真实 AppID 的断言随即跳过。
        # tee 会吞掉退出码，所以先记下 outcome，再单独汇总失败原因。
        continue-on-error: true
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | tee /tmp/go-test.log

      - name: 汇总测试失败
        if: steps.gotest.outcome == 'failure'
        run: |
          echo "## go test 失败明细" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^--- FAIL|^FAIL|panic:|^ +[A-Za-z0-9_]+_test\.go:[0-9]+:" /tmp/go-test.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 转成 annotation，Actions 页面和 check-runs API 都能读到
          grep -E "^--- FAIL|panic:|^ +[A-Za-z0-9_]+_test\.go:[0-9]+:" /tmp/go-test.log \
            | head -15 | while IFS= read -r line; do echo "::error::$line"; done
          exit 1

  bridge:
    name: 桥接脚本测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 运行 bridge 测试
        working-directory: work/importer-v2
        run: node --test bridge_test.mjs

  build:
    name: 编译 ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe
          - os: darwin
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: linux
            arch: amd64
            ext: ""
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: work/importer-v2/go.sum

      - name: 编译核心
        working-directory: work/importer-v2
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=v0.0.0-ci" \
            -o "$RUNNER_TEMP/core${{ matrix.ext }}" .
          ls -lh "$RUNNER_TEMP/core${{ matrix.ext }}"

      - name: 冒烟：离线自测
        # -self-test 不连 Steam，只验证内置逻辑，可跨平台跑。
        if: matrix.os == 'linux'
        run: |
          chmod +x "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core" -self-test

      - name: 冒烟：清单信息
        if: matrix.os == 'linux'
        run: |
          "$RUNNER_TEMP/core" -manifest-info

  desktop:
    name: 桌面单文件（Windows）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: work/importer-v2
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: work/importer-v2/go.sum

      # 桌面入口和核心在同一个包里（-tags desktop），窗口直接拿内存里的 handler。
      # 三条约定（/ → /ui、/ui → /、注入 __desktopShell）由 desktop_test.go 盯住。
      - name: go vet
        run: go vet -tags desktop,production ./...

      - name: go test
        run: go test -tags desktop,production ./...

      - name: 编译单文件 GUI
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE/scripts/build_desktop.py" `
            --platform windows/amd64 --version v0.0.0-ci --out "$env:RUNNER_TEMP/dist"
          Get-ChildItem "$env:RUNNER_TEMP/dist"

      # 这条断言就是「单文件」本身：多出任何文件（比如以前的 Resources 子进程）都算失败。
      - name: 确认产物只有一个文件
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "$env:RUNNER_TEMP/dist" -File -Recurse)
          if ($files.Count -ne 1) {
            $files | ForEach-Object { Write-Host $_.FullName }
            throw "单文件产物应只有 1 个文件，实际 $($files.Count)"
          }
          $mb = [math]::Round($files[0].Length / 1MB, 1)
          Write-Host "OK：$($files[0].Name)  $mb MB"

  guard:
    name: 隐私与产物检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 禁止个人数据入库
        run: |
          set -e
          fail=0
          # 真实 Steam 清单、账号、库快照一律不进仓库
          for pattern in 'work/importer-v2/classification.json' \
                         'work/importer-v2/live-fresh.json'; do
            if git ls-files --error-unmatch "$pattern" >/dev/null 2>&1; then
              echo "::error::$pattern 不应被 Git 跟踪"
              fail=1
            fi
          done
          # 只针对真实账号，不用通用 17 位正则——测试夹具里的假 ID
          # （基址+12345）是合法且必要的，不该被误伤。
          # 必须排除 .github：否则规则字符串会命中本文件自己。
          if git grep -nIE '137903045|76561198098168773' -- ':!vendor' ':!.github' ':!*.md'; then
            echo "::error::源码中出现真实账号标识"
            fail=1
          fi
          exit $fail

      - name: 构建产物不入库
        run: |
          if git ls-files | grep -Ei '\.(exe|app|dmg|zip)$'; then
            echo "::error::仓库中出现了二进制产物"
            exit 1
          fi
          echo "OK"
