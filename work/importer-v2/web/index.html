<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Steam 收藏整理</title>
    <script>
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('steam-collection-importer-theme') || 'light',
        );
      } catch (e) {}
    </script>
    <style>
      {{CSS}}
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <div>
          <h1>Steam 收藏整理</h1>
        </div>
        <div class="top-right">
          <div id="status" class="status">正在读取 Steam…</div>
        </div>
      </div>
      <div id="themeSwitcher">
        <button
          id="themeToggle"
          class="theme-toggle"
          onclick="toggleTheme()"
          title="切换白天/黑夜模式"
          aria-label="切换白天/黑夜模式"
        >
          🌙
        </button>
      </div>
      <div class="toolbar codex-nav">
        <button onclick="showTab('library')" class="secondary">游戏库</button
        ><button onclick="showTab('history')" class="secondary">历史</button
        ><button onclick="diagnostics()" class="connection-action">
          连接诊断</button
        ><button onclick="refreshList()" class="secondary connection-action">
          刷新列表</button
        ><button onclick="quitTool()" class="secondary">退出工具</button>
      </div>
      <section id="diagnosticsPanel" class="panel hidden">
        <h2>连接诊断</h2>
        <div id="diagnosticsResult"></div>
      </section>
      <dialog id="diagnosticsDialog">
        <div class="dialog-head">
          <h2>连接诊断</h2>
          <button
            type="button"
            class="secondary"
            onclick="document.querySelector('#diagnosticsDialog').close()"
          >
            关闭
          </button>
        </div>
        <div id="diagnosticsDialogContent"><p>正在等待诊断结果…</p></div>
      </dialog>
      <div id="libraryView">
        <div class="layout">
          <aside class="panel sticky">
            <div class="view-switch">
              <button
                class="secondary"
                onclick="
                  browsingActual = true;
                  selected = '';
                  renderAll();
                "
              >
                当前收藏</button
              ><button
                class="secondary"
                onclick="
                  browsingActual = false;
                  selected = '';
                  renderAll();
                "
              >
                待保存
              </button>
            </div>
            <div id="collectionHead">
              <h2>收藏</h2>
              <span
                id="collectionHint"
                tabindex="0"
                role="note"
                aria-label="动态收藏由你在 Steam 中创建和维护，程序只读取它们来计算重叠，不会自动创建、改名或修改动态规则。"
                >ⓘ</span
              ><button onclick="apply()" class="warn">确认保存收藏</button>
            </div>
            <div id="dynamicTree" class="tree"></div>
            <div id="staticTree" class="tree"></div>
          </aside>
          <section class="panel">
            <div class="toolbar codex-main-heading">
              <h2 id="collectionTitle">全部游戏</h2>
              <button
                onclick="toggleAI()"
                id="aiToggle"
                class="secondary"
                title="打开或收起 AI 整理面板"
              >
                ✨ AI 整理</button
              ><span id="selectionCount" class="subtle"
                >已选 0 款（跨页保留）</span
              ><button
                onclick="previewRemoval()"
                class="warn"
                title="仅可移除中国区当前免费、之后仍可重新获取且没有游玩记录的游戏；工具会在执行前再次核验。"
                aria-label="仅可移除中国区当前免费、之后仍可重新获取且没有游玩记录的游戏；工具会在执行前再次核验。"
              >
                移除游戏</button
              ><button onclick="refreshPrices()" class="secondary">
                获取商店资料和价格</button
              ><span id="collectionMeta" class="subtle" hidden></span>
            </div>
            <div id="filterColumn">
              <input
                id="search"
                placeholder="搜索名称、AppID 或厂商"
                oninput="
                  pageNo = 0;
                  renderGames();
                "
              /><button
                id="searchToggle"
                type="button"
                class="secondary"
                title="显示或隐藏搜索框"
              >
                🔍 搜索</button
              ><select
                id="gameSort"
                onchange="
                  pageNo = 0;
                  renderGames();
                "
              >
                <option value="name">按名称</option>
              </select>
            </div>
            <select
              id="publisherFilter"
              hidden
              onchange="
                pageNo = 0;
                renderGames();
              "
            ></select>
            <input
              id="bulkTarget"
              list="bulkTargets"
              hidden
              placeholder="输入或选择目标静态收藏"
            /><datalist id="bulkTargets"></datalist>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>
                      <input
                        id="selectAll"
                        type="checkbox"
                        title="全选当前筛选结果（跨页）"
                        aria-label="全选当前筛选结果"
                      />
                    </th>
                    <th>游戏</th>
                    <th>目标收藏</th>
                    <th>发行厂商</th>
                    <th>最后游玩</th>
                    <th>游玩时长</th>
                    <th>中国区价格</th>
                    <th>状态</th>
                  </tr>
                </thead>
                <tbody id="games"></tbody>
              </table>
            </div>
            <div class="toolbar">
              <button onclick="pageBy(-1)" class="secondary">上一页</button
              ><span id="pageInfo" class="subtle"></span
              ><button onclick="pageBy(1)" class="secondary">下一页</button>
            </div>
          </section>
          <details class="panel ai-panel" id="aiPanel">
            <summary>AI 整理</summary>
            <p class="subtle">
              分类提示词由你编写，AI 结果会先进入独立审核窗口。
            </p>
            <input
              id="aiurl"
              placeholder="OpenAI 兼容地址，例如 https://api.example.com/v1"
            /><input
              id="aikey"
              type="password"
              placeholder="API Key（保存在本机设置文件）"
            /><button onclick="models()">获取模型</button
            ><select id="model"></select
            ><textarea
              id="prompt"
              class="ai-prompt"
              placeholder="请填写自己的分类规则。例如：知名大作按系列归类，精品独立游戏单独收藏，其余按玩法分类。此处参考仅供修改。"
            ></textarea
            ><button onclick="suggest()">生成 AI 草稿并审核</button>
            <div id="priceInfo" class="subtle"></div>
          </details>
        </div>
        <section class="panel hidden">
          <h2>预览和执行日志</h2>
          <div id="preview">尚未预览</div>
        </section>
      </div>
      <section id="historyView" class="panel hidden">
        <h2>历史</h2>
        <p class="subtle">
          仅在实际应用收藏修改前自动备份；读取、导入和预览不会产生历史。外置整理清单也在这里，删除只影响本机文件。
        </p>
        <input
          id="ruleFile"
          type="file"
          accept=".json,application/json"
        /><button onclick="importRules()" class="secondary">
          导入 JSON 到审核窗口</button
        ><button onclick="exportCurrent()" class="secondary">
          导出当前方案 JSON</button
        ><button onclick="exportLibrary()" class="secondary">
          导出游戏列表和收藏</button
        ><button onclick="refreshHistory()" class="secondary">刷新历史</button>
        <div id="historyList" class="tree"></div>
      </section>
    </main>
    <script>
      {{JS}}
    </script>
  </body>
</html>
