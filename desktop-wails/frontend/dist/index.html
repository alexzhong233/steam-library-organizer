<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Steam 收藏整理</title>
  <style>
    html,body,#app{height:100%;margin:0;background:#0f1720;color:#e9f0f5}
    #loading{height:100%;display:grid;place-items:center;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    iframe{display:none;width:100%;height:100%;border:0;background:#0f1720}
  </style>
</head>
<body>
  <div id="app"><div id="loading">正在启动 Steam 收藏整理…</div><iframe id="core" title="Steam 收藏整理"></iframe></div>
  <script>
    (async function () {
      const loading = document.getElementById('loading');
      const frame = document.getElementById('core');
      try {
        const url = await window.go.main.App.CoreURL();
        if (!url) throw new Error(await window.go.main.App.CoreError() || '核心没有返回 GUI 地址');
        frame.src = url;
        frame.onload = () => { loading.style.display = 'none'; frame.style.display = 'block'; };
      } catch (e) {
        loading.textContent = '启动失败：' + (e && e.message ? e.message : e);
      }
    })();
  </script>
</body>
</html>
